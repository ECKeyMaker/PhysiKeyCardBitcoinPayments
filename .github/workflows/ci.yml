name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Includes __tests__/deriveKey.test.ts, which fails if any change would move existing wallets.
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
